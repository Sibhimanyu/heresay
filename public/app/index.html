<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heresay</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/dashboard.css">
<link rel="stylesheet" href="/workspace.css">
</head>
<body class="booting pending">

<!-- The one loader: from first paint until a page has everything it needs -->
<div id="loader" class="app-loader on" role="status" aria-label="Loading"><img class="light-only" src="/loader.svg" alt="" width="96" height="96"><img class="dark-only" src="/loader-dark.svg" alt="" width="96" height="96"></div>

<!-- Signed out -->
<div id="gate" class="gate" hidden>
  <img class="light-only" src="/mark.svg" alt="" width="64" height="64"><img class="dark-only" src="/mark-dark.svg" alt="" width="64" height="64">
  <h1>Sign in to your Heresay</h1>
  <p class="mute">Use the account your team owner added.</p>
  <button id="google" class="btn primary wide"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#fff" d="M21.35 11.1H12v2.98h5.35c-.23 1.38-1.64 4.05-5.35 4.05a5.93 5.93 0 0 1 0-11.86c1.83 0 3.06.78 3.76 1.45l2.57-2.47C16.68 3.7 14.55 2.7 12 2.7a9.3 9.3 0 1 0 0 18.6c5.37 0 8.93-3.77 8.93-9.09 0-.61-.07-1.08-.16-1.54z"/></svg>Continue with Google</button>
  <div class="or"><span>or</span></div>
  <form id="link-form" class="link-form">
    <label class="sr" for="link-email">Email</label>
    <input id="link-email" type="email" required placeholder="you@company.com" autocomplete="email">
    <button class="btn wide">Email me a sign-in link</button>
  </form>
  <p id="gate-msg" class="gate-msg" role="status"></p>
</div>

<!-- Signed in, but this Heresay can't let them in -->
<div id="blocked" class="gate" hidden>
  <img class="light-only" src="/mark.svg" alt="" width="64" height="64"><img class="dark-only" src="/mark-dark.svg" alt="" width="64" height="64">
  <h1 id="blocked-title"></h1>
  <p id="blocked-text" class="mute"></p>
  <button id="blocked-out" class="btn wide">Use another account</button>
</div>

<div id="app" hidden>
  <a class="skip-link" href="#view">Skip to content</a>
  <aside class="sidebar" aria-label="Workspace navigation">
    <button id="nav-close" class="btn ghost nav-close" type="button" aria-label="Close navigation">×</button>
    <a class="brand" href="#/inbox" aria-label="Heresay inbox"><img class="light-only" src="/logo.svg" alt="Heresay" height="30"><img class="dark-only" src="/logo-dark.svg" alt="Heresay" height="30"></a>
    <div class="workspace-label"><span class="workspace-icon" aria-hidden="true">H</span><span>Your workspace</span><span class="workspace-role" id="workspace-role"></span></div>
    <nav class="tabs" aria-label="Main">
      <a href="#/inbox" data-nav="inbox"><span class="nav-icon" data-icon="inbox"></span>Inbox<span id="inbox-count" class="nav-count" hidden></span></a>
      <a href="#/apps" data-nav="apps"><span class="nav-icon" data-icon="apps"></span>Apps</a>
      <a href="#/connect" data-nav="connect"><span class="nav-icon" data-icon="repos"></span>Connected repos</a>
      <a href="#/chat" data-nav="chat"><span class="nav-icon" data-icon="chat"></span>Chat apps</a>
    </nav>
    <div class="nav-section">Workspace</div>
    <nav class="tabs" aria-label="Workspace settings">
      <a href="#/team" data-nav="team"><span class="nav-icon" data-icon="team"></span>Team</a>
      <a href="#/notifications" data-nav="notifications"><span class="nav-icon" data-icon="bell"></span>Notifications</a>
    </nav>
    <div class="sidebar-bottom">
      <button id="theme-toggle" class="theme-toggle" type="button">Theme<span class="theme-name"></span></button>
      <a class="help-link" href="/docs.html" target="_blank" rel="noopener"><span class="nav-icon" data-icon="help"></span>Help &amp; docs<span aria-hidden="true">↗</span></a>
      <div class="account"><span id="account-avatar" class="avatar" aria-hidden="true">H</span><span id="who" class="who"></span></div>
      <button id="signout" class="btn ghost signout">Sign out</button>
    </div>
  </aside>
  <button id="nav-scrim" class="nav-scrim" type="button" aria-label="Close navigation" tabindex="-1"></button>
  <header class="workspace-top"><button id="nav-toggle" class="btn ghost" aria-label="Open navigation" aria-expanded="false" type="button">☰</button><span class="breadcrumb">Workspace <span aria-hidden="true">/</span> <span id="page-label">Apps</span></span><span class="top-caption">Every report gets a hearing.</span></header>
  <div id="update" class="update" role="status" hidden></div>
  <main id="view" tabindex="-1"></main>
</div>

<script src="/__/firebase/10.14.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.14.1/firebase-auth-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script src="/dashboard.js"></script>
</body>
</html>
