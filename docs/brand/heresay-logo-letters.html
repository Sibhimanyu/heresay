<text x="60" y="94" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f5f6f7">Heresay · letter marks, in your house style</text>
<text x="60" y="134" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#b9bdc6">Learned from Greenroom and Imago: start from the letter · hide a second reading in it · one heavy rounded stroke · one bright accent piece · test at 16px</text>
