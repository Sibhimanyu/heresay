<!doctype html><meta charset="utf-8"><title>Heresay loaders</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Figtree:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:56px 48px;background:#fff;color:#15171c;font:15px/1.5 Figtree,system-ui,sans-serif}
h1{font:800 40px/1 "Bricolage Grotesque",sans-serif;color:#0b5e57;margin:0 0 6px;letter-spacing:-.02em}
p.lede{color:#5b6472;margin:0 0 40px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:28px}
figure{margin:0;border:1px solid #e3e6ea;border-radius:18px;overflow:hidden}
.pair{display:grid;grid-template-columns:1fr 1fr}
.pair>div{height:180px;display:grid;place-items:center}
.dark{background:#15171c}
.small{display:flex;gap:18px;align-items:center;padding:14px 18px;border-top:1px solid #e3e6ea;background:#f5f6f7}
.small img{display:block}
button{display:inline-flex;gap:8px;align-items:center;font:600 14px Figtree,sans-serif;background:#fff;color:#15171c;border:1px solid #e3e6ea;border-radius:999px;padding:7px 14px}
figcaption{padding:14px 18px 18px;color:#5b6472}
figcaption b{color:#15171c;margin-right:4px}
code{display:block;margin-top:6px;font:12px "JetBrains Mono",monospace;color:#0b5e57}
</style>
<h1>Loading, with a face</h1>
<p class="lede">Seven loaders built from the exact mark geometry. Each is one animated SVG, in a peacock and an on-dark version; all hold still under reduced motion.</p>
<main><figure><div class="pair"><div class="light"><img src="svg/loaders/heresay-loader-swirl.svg" style="height:120px" alt=""></div><div class="dark"><img src="svg/loaders/heresay-loader-swirl-on-dark.svg" style="height:120px" alt=""></div></div><div class="small"><button><img src="svg/loaders/heresay-loader-swirl.svg" style="height:18px" alt=""> Sending</button><span><img src="svg/loaders/heresay-loader-swirl.svg" style="height:28px" alt=""></span><span><img src="svg/loaders/heresay-loader-swirl.svg" style="height:16px" alt=""></span></div><figcaption><b>Swirl</b> The waves travel; the face stays put. Default spinner.<code>heresay-loader-swirl.svg</code></figcaption></figure><figure><div class="pair"><div class="light"><img src="svg/loaders/heresay-loader-breathe.svg" style="height:120px" alt=""></div><div class="dark"><img src="svg/loaders/heresay-loader-breathe-on-dark.svg" style="height:120px" alt=""></div></div><div class="small"><button><img src="svg/loaders/heresay-loader-breathe.svg" style="height:18px" alt=""> Sending</button><span><img src="svg/loaders/heresay-loader-breathe.svg" style="height:28px" alt=""></span><span><img src="svg/loaders/heresay-loader-breathe.svg" style="height:16px" alt=""></span></div><figcaption><b>Breathe</b> Circle to waves and back. Calm, for long waits.<code>heresay-loader-breathe.svg</code></figcaption></figure><figure><div class="pair"><div class="light"><img src="svg/loaders/heresay-loader-glance.svg" style="height:120px" alt=""></div><div class="dark"><img src="svg/loaders/heresay-loader-glance-on-dark.svg" style="height:120px" alt=""></div></div><div class="small"><button><img src="svg/loaders/heresay-loader-glance.svg" style="height:18px" alt=""> Sending</button><span><img src="svg/loaders/heresay-loader-glance.svg" style="height:28px" alt=""></span><span><img src="svg/loaders/heresay-loader-glance.svg" style="height:16px" alt=""></span></div><figcaption><b>Glance</b> Looks left, looks right, blinks. For "thinking".<code>heresay-loader-glance.svg</code></figcaption></figure><figure><div class="pair"><div class="light"><img src="svg/loaders/heresay-loader-chatter.svg" style="height:120px" alt=""></div><div class="dark"><img src="svg/loaders/heresay-loader-chatter-on-dark.svg" style="height:120px" alt=""></div></div><div class="small"><button><img src="svg/loaders/heresay-loader-chatter.svg" style="height:18px" alt=""> Sending</button><span><img src="svg/loaders/heresay-loader-chatter.svg" style="height:28px" alt=""></span><span><img src="svg/loaders/heresay-loader-chatter.svg" style="height:16px" alt=""></span></div><figcaption><b>Chatter</b> The quote marks hop in turn. For "sending".<code>heresay-loader-chatter.svg</code></figcaption></figure><figure><div class="pair"><div class="light"><img src="svg/loaders/heresay-loader-trace.svg" style="height:120px" alt=""></div><div class="dark"><img src="svg/loaders/heresay-loader-trace-on-dark.svg" style="height:120px" alt=""></div></div><div class="small"><button><img src="svg/loaders/heresay-loader-trace.svg" style="height:18px" alt=""> Sending</button><span><img src="svg/loaders/heresay-loader-trace.svg" style="height:28px" alt=""></span><span><img src="svg/loaders/heresay-loader-trace.svg" style="height:16px" alt=""></span></div><figcaption><b>Trace</b> Draws the outline, fills, opens its eyes. For first load.<code>heresay-loader-trace.svg</code></figcaption></figure><figure><div class="pair"><div class="light"><img src="svg/loaders/heresay-loader-crests.svg" style="height:120px" alt=""></div><div class="dark"><img src="svg/loaders/heresay-loader-crests-on-dark.svg" style="height:120px" alt=""></div></div><div class="small"><button><img src="svg/loaders/heresay-loader-crests.svg" style="height:18px" alt=""> Sending</button><span><img src="svg/loaders/heresay-loader-crests.svg" style="height:28px" alt=""></span><span><img src="svg/loaders/heresay-loader-crests.svg" style="height:16px" alt=""></span></div><figcaption><b>Crests</b> A light runs round the six waves. For progress.<code>heresay-loader-crests.svg</code></figcaption></figure><figure><div class="pair"><div class="light"><img src="svg/loaders/heresay-loader-trio.svg" style="height:44px" alt=""></div><div class="dark"><img src="svg/loaders/heresay-loader-trio-on-dark.svg" style="height:44px" alt=""></div></div><div class="small"><button><img src="svg/loaders/heresay-loader-trio.svg" style="height:18px" alt=""> Sending</button><span><img src="svg/loaders/heresay-loader-trio.svg" style="height:28px" alt=""></span><span><img src="svg/loaders/heresay-loader-trio.svg" style="height:16px" alt=""></span></div><figcaption><b>Trio</b> Three marks bounce, a branded "…". Inline and chat.<code>heresay-loader-trio.svg</code></figcaption></figure></main>
